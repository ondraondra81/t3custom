name: T3 Custom macOS preview
run-name: T3 Custom ${{ inputs.stable_tag || (inputs.notarization_id && 'notary status') || 'preview' }}

on:
  workflow_dispatch:
    inputs:
      stable_tag:
        description: Merged upstream stable tag (v0.1.8 or newer); enables the fork update feed
        type: string
        default: ""
      publish_release:
        description: Publish the verified stable release (requires signed and prepare_release)
        type: boolean
        default: false
      notarization_id:
        description: Inspect an existing Apple submission instead of building (custom branch only)
        type: string
        default: ""
      signed:
        description: Sign with Developer ID and notarize (custom branch only; Apple secrets required)
        type: boolean
        default: false
      prepare_release:
        description: Prepare a draft GitHub release after the packaged app passes its launch check
        type: boolean
        default: false
  push:
    branches: [custom, feat/desktop-groups]
  pull_request:
    branches: [custom]

permissions:
  contents: read

concurrency:
  group: t3custom-${{ inputs.notarization_id && 'notary-status' || 'desktop' }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notary-status:
    if: github.repository == 'ondraondra81/t3custom' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/custom' && inputs.notarization_id != ''
    environment: t3custom-apple
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Inspect existing Apple notarization submission
        env:
          SUBMISSION_ID: ${{ inputs.notarization_id }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SUBMISSION_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]
          args=(--apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID")
          xcrun notarytool info "$SUBMISSION_ID" "${args[@]}" --output-format json > "$RUNNER_TEMP/notary-status.json"
          cat "$RUNNER_TEMP/notary-status.json"
          status=$(jq -r .status "$RUNNER_TEMP/notary-status.json")
          if [[ "$status" == Invalid || "$status" == Rejected ]]; then
            xcrun notarytool log "$SUBMISSION_ID" "${args[@]}" "$RUNNER_TEMP/notary-log.json"
            cat "$RUNNER_TEMP/notary-log.json"
          fi
  check:
    if: github.repository == 'ondraondra81/t3custom' && !inputs.notarization_id
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      stable_version: ${{ steps.stable.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-ci-deps
      - name: Validate stable release source
        id: stable
        if: inputs.stable_tag != '' || inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_TAG: ${{ inputs.stable_tag }}
          SIGNED_BUILD: ${{ inputs.signed }}
          PREPARE_RELEASE: ${{ inputs.prepare_release }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/custom
          test "$SIGNED_BUILD" = true
          test "$PREPARE_RELEASE" = true
          version=$(node scripts/t3custom/stable-release.ts stable-version "$STABLE_TAG")
          gh api "repos/pingdotgg/t3code/releases/tags/$STABLE_TAG" > "$RUNNER_TEMP/upstream-release.json"
          jq -e --arg tag "$STABLE_TAG" '.tag_name == $tag and .draft == false and .prerelease == false' "$RUNNER_TEMP/upstream-release.json"
          git fetch https://github.com/pingdotgg/t3code.git "refs/tags/$STABLE_TAG"
          upstream_sha=$(git rev-parse 'FETCH_HEAD^{commit}')
          test "$(cat .t3custom-upstream)" = "$upstream_sha"
          git merge-base --is-ancestor "$upstream_sha" HEAD
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install test browser
        run: vp exec --filter @t3tools/web playwright install --with-deps chromium
      - name: Check fork changes
        shell: bash
        run: |
          baseline=$(cat .t3custom-upstream)
          [[ "$baseline" =~ ^[0-9a-f]{40}$ ]]
          vp run check:changed "$baseline" --concurrency 2

  mac:
    needs: check
    if: ${{ !inputs.signed || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/custom') }}
    environment: ${{ inputs.signed && 't3custom-apple' || 't3custom-preview' }}
    outputs:
      version: ${{ steps.build.outputs.version }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      T3CUSTOM_DESKTOP: "1"
      T3CODE_DESKTOP_UPDATE_REPOSITORY: ondraondra81/t3custom
      SIGNED_BUILD: ${{ inputs.signed && 'true' || 'false' }}
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ inputs.signed && 'true' || 'false' }}
      CSC_FOR_PULL_REQUEST: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup-ci-deps
      - name: Require Apple credentials for signed build
        if: inputs.signed
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then echo "Missing environment secret: $name" >&2; exit 1; fi
          done
      - name: Build Apple Silicon preview
        id: build
        env:
          STABLE_VERSION: ${{ needs.check.outputs.stable_version }}
          CSC_LINK: ${{ inputs.signed && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ inputs.signed && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ inputs.signed && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ inputs.signed && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ inputs.signed && secrets.APPLE_TEAM_ID || '' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          base_version=$(node -p "require('./apps/desktop/package.json').version")
          version="$base_version-preview.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          if [[ -n "$STABLE_VERSION" ]]; then version="$STABLE_VERSION"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          args=(--platform mac --target dmg --arch arm64 --build-version "$version")
          if [[ "$SIGNED_BUILD" == true ]]; then args+=(--signed); fi
          vp run dist:desktop:artifact "${args[@]}"
      - name: Notarize and staple installer
        if: inputs.signed
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          dmg=(release/*.dmg)
          test "${#dmg[@]}" -eq 1
          xcrun notarytool submit "${dmg[0]}" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait --timeout 20m
          xcrun stapler staple "${dmg[0]}"
          xcrun stapler validate "${dmg[0]}"
      - name: Launch packaged app with isolated fixture data
        shell: bash
        run: |
          set -euo pipefail
          mount="$RUNNER_TEMP/t3custom-launch"
          dmg=(release/*.dmg)
          test "${#dmg[@]}" -eq 1
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "${dmg[0]}"
          trap 'hdiutil detach "$mount" -force >/dev/null || true' EXIT
          app="$mount/T3 Custom.app"
          codesign --verify --deep --strict "$app"
          if [[ "$SIGNED_BUILD" == true ]]; then
            codesign --display --verbose=4 "$app" 2> "$RUNNER_TEMP/t3custom-signature.txt"
            grep -q '^Authority=Developer ID Application:' "$RUNNER_TEMP/t3custom-signature.txt"
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=2 "$app"
          fi
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          node scripts/smoke-desktop-app.ts --executable "$app/Contents/MacOS/$executable" --artifacts-dir "$RUNNER_TEMP/t3custom-smoke"
      - name: Verify signed update archive
        if: inputs.stable_tag != ''
        env:
          BUILD_VERSION: ${{ steps.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          unpacked="$RUNNER_TEMP/t3custom-update"
          ditto -x -k "release/T3-Custom-$BUILD_VERSION-arm64.zip" "$unpacked"
          app="$unpacked/T3 Custom.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = dev.ondraondra81.t3custom
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$BUILD_VERSION"
          codesign --verify --deep --strict "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
          feed="$app/Contents/Resources/app-update.yml"
          grep -qx 'provider: github' "$feed"
          grep -qx 'owner: ondraondra81' "$feed"
          grep -qx 'repo: t3custom' "$feed"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          node scripts/smoke-desktop-app.ts --executable "$app/Contents/MacOS/$executable" --artifacts-dir "$RUNNER_TEMP/t3custom-update-smoke"
      - name: Record provenance and checksums
        env:
          STABLE_VERSION: ${{ needs.check.outputs.stable_version }}
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > release/COMMIT.txt
          if [[ "$SIGNED_BUILD" == true ]]; then
            printf '%s\n' 'Developer ID signed and Apple notarized Apple Silicon preview. Install manually; built-in updates are disabled.' > release/INSTALL.txt
          else
            printf '%s\n' 'Ad-hoc signed Apple Silicon preview, without Developer ID or notarization. Install manually; built-in updates are disabled.' > release/INSTALL.txt
          fi
          if [[ -n "$STABLE_VERSION" ]]; then
            node scripts/t3custom/stable-release.ts finalize "$STABLE_VERSION"
            printf '%s\n' 'Developer ID signed and Apple notarized Apple Silicon release. Built-in updates use ondraondra81/t3custom stable releases.' > release/INSTALL.txt
            cd release
            shasum -a 256 ./*.dmg ./*.zip ./*.zip.blockmap latest-mac.yml COMMIT.txt INSTALL.txt > SHA256SUMS
          else
            cd release
            shasum -a 256 ./*.dmg > SHA256SUMS
          fi
      - uses: actions/upload-artifact@v4
        if: inputs.stable_tag == ''
        with:
          name: t3custom-macos-arm64
          path: |
            release/*.dmg
            release/COMMIT.txt
            release/INSTALL.txt
            release/SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: inputs.stable_tag != ''
        with:
          name: t3custom-macos-arm64
          path: |
            release/*.dmg
            release/*.zip
            release/*.zip.blockmap
            release/latest-mac.yml
            release/COMMIT.txt
            release/INSTALL.txt
            release/SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: t3custom-launch-diagnostics
          path: ${{ runner.temp }}/t3custom-smoke

  release:
    needs: mac
    if: github.event_name == 'push' && github.ref == 'refs/heads/custom' || github.event_name == 'workflow_dispatch' && inputs.prepare_release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: t3custom-macos-arm64
          path: release
      - name: Prepare complete draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_VERSION: ${{ needs.mac.outputs.version }}
          BUILD_COMMIT: ${{ github.sha }}
          SIGNED_BUILD: ${{ inputs.signed && 'true' || 'false' }}
          STABLE_TAG: ${{ inputs.stable_tag }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        shell: bash
        run: |
          set -euo pipefail
          (cd release && sha256sum --check SHA256SUMS)
          test "$(cat release/COMMIT.txt)" = "$BUILD_COMMIT"
          if [[ -n "$STABLE_TAG" ]]; then
            tag="v$BUILD_VERSION"
            cat > "$RUNNER_TEMP/notes.md" <<EOF
          T3 Custom for Apple Silicon, based on upstream $STABLE_TAG. Source: $BUILD_COMMIT.

          Developer ID signed, Apple notarized and verified by Gatekeeper. The packaged app and update ZIP passed isolated launch checks. Built-in updates use stable releases from this fork.

          Quit T3 Custom and back up ~/.t3custom before upgrading. Keep the original ~/.t3 when imported workspaces still use it. The first installation of the updater-enabled version is manual; subsequent updates use the existing T3 update controls. Native passkey features requiring upstream entitlements are unavailable.
          EOF
            gh release create "$tag" release/* --target "$BUILD_COMMIT" --title "T3 Custom $BUILD_VERSION" --notes-file "$RUNNER_TEMP/notes.md" --draft
            if [[ "$PUBLISH_RELEASE" == true ]]; then
              gh release edit "$tag" --draft=false --latest
            fi
            exit 0
          fi
          tag="t3custom-v$BUILD_VERSION"
          if [[ "$SIGNED_BUILD" == true ]]; then
            signing='This build is signed with Developer ID and notarized by Apple.'
          else
            signing='This build has no Developer ID signature or notarization; macOS may require allowing it in System Settings → Privacy & Security.'
          fi
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          Apple Silicon preview of T3 Custom, built from $BUILD_COMMIT.

          Download the DMG and install T3 Custom in Applications. $signing

          Data and settings are separate from official T3 Code. Enable Project groups in Settings → Labs. This preview uses manual updates.
          EOF
          gh release create "$tag" release/* --target "$BUILD_COMMIT" --title "T3 Custom $BUILD_VERSION" --notes-file "$RUNNER_TEMP/notes.md" --prerelease --draft
